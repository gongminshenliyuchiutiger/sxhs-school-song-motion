<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙溪高中校歌 - 體感接歌詞遊戲 Motion Lyric Catcher</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MediaPipe Hands & Camera Utils CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Yuji+Mai&display=swap');
        
        :root {
            --bg-body: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            --c-card-bg: rgba(15, 23, 42, 0.88);
            --card-border: rgba(245, 158, 11, 0.4);
            --title-gradient: linear-gradient(45deg, #ef4444, #f59e0b, #38bdf8);
            --taiko-red: #ef4444;
            --taiko-red-dark: #991b1b;
            --taiko-blue: #0284c7;
            --taiko-blue-dark: #075985;
            --taiko-gold: #f59e0b;
            --c-text: #f8fafc;
            --hand-glow: #38bdf8;
        }

        /* 浪漫夜櫻風 (Sakura Night) */
        body[data-theme="sakura"] {
            --bg-body: radial-gradient(circle at center, #4c1d95 0%, #1e1b4b 50%, #0f0728 100%);
            --c-card-bg: rgba(30, 15, 55, 0.9);
            --card-border: rgba(244, 114, 182, 0.5);
            --title-gradient: linear-gradient(45deg, #f472b6, #fb7185, #c084fc);
            --taiko-red: #f43f5e;
            --taiko-red-dark: #881337;
            --taiko-blue: #a855f7;
            --taiko-blue-dark: #581c87;
            --taiko-gold: #fb7185;
            --hand-glow: #f472b6;
        }

        /* 賽博霓虹風 (Cyberpunk Neon) */
        body[data-theme="cyberpunk"] {
            --bg-body: radial-gradient(circle at center, #092e34 0%, #030712 70%, #000000 100%);
            --c-card-bg: rgba(6, 18, 30, 0.92);
            --card-border: rgba(6, 182, 212, 0.6);
            --title-gradient: linear-gradient(45deg, #22d3ee, #e879f9, #f43f5e);
            --taiko-red: #ff0055;
            --taiko-red-dark: #990033;
            --taiko-blue: #00f0ff;
            --taiko-blue-dark: #0088cc;
            --taiko-gold: #00ffcc;
            --hand-glow: #00f0ff;
        }

        /* 翡翠竹林風 (Emerald Forest) */
        body[data-theme="emerald"] {
            --bg-body: radial-gradient(circle at center, #064e3b 0%, #022c22 60%, #01140e 100%);
            --c-card-bg: rgba(4, 30, 24, 0.9);
            --card-border: rgba(52, 211, 153, 0.5);
            --title-gradient: linear-gradient(45deg, #34d399, #a3e635, #38bdf8);
            --taiko-red: #10b981;
            --taiko-red-dark: #065f46;
            --taiko-blue: #0ea5e9;
            --taiko-blue-dark: #0369a1;
            --taiko-gold: #a3e635;
            --hand-glow: #34d399;
        }

        /* 炫金奢華風 (Luxury Gold) */
        body[data-theme="gold"] {
            --bg-body: radial-gradient(circle at center, #27272a 0%, #09090b 70%, #000000 100%);
            --c-card-bg: rgba(24, 24, 27, 0.92);
            --card-border: rgba(234, 179, 8, 0.6);
            --title-gradient: linear-gradient(45deg, #fef08a, #eab308, #ca8a04);
            --taiko-red: #eab308;
            --taiko-red-dark: #854d0e;
            --taiko-blue: #38bdf8;
            --taiko-blue-dark: #0369a1;
            --taiko-gold: #fef08a;
            --hand-glow: #eab308;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-body);
            background-size: 200% 200%;
            animation: bgPulse 12s ease infinite alternate;
            color: var(--c-text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px 12px 65px 12px;
            font-family: 'Noto Sans TC', sans-serif;
            overflow-y: auto;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        @keyframes bgPulse {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .background-icons {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .background-icons i {
            position: absolute;
            color: rgba(255, 255, 255, 0.12);
            animation: floatUp 16s linear infinite;
        }
        @keyframes floatUp {
            from { transform: translateY(0) rotate(0deg); opacity: 0.7; bottom: -10%; }
            to { transform: translateY(-1200px) rotate(360deg); opacity: 0; bottom: 110%; }
        }

        .container {
            width: 100%;
            max-width: 980px;
            background: var(--c-card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6), 0 0 25px rgba(239, 68, 68, 0.2);
            padding: 18px 22px;
            position: relative;
            z-index: 1;
            margin-top: 5px;
            border: 2px solid var(--card-border);
            transition: all 0.5s ease;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            position: relative;
        }
        header h1 {
            font-size: 1.9em;
            font-weight: 900;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 15px rgba(239, 68, 68, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 1px;
        }
        header p.subtitle {
            color: #cbd5e1;
            font-size: 0.88em;
            margin-top: 3px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .taiko-dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 10px;
        }
        .dash-card {
            background: #090d16;
            border-radius: 18px;
            padding: 10px 16px;
            border: 2px solid var(--taiko-red-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
            transition: border-color 0.5s ease;
        }
        .dash-action-card {
            border-color: rgba(245, 158, 11, 0.4);
            gap: 8px;
        }

        .main-start-bar {
            text-align: center;
            width: 100%;
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .btn-hero {
            flex: 1;
            padding: 12px 16px;
            font-size: 1.05em;
            border-radius: 30px;
            letter-spacing: 1px;
            justify-content: center;
            animation: heroPulse 2s infinite ease-in-out;
        }
        @keyframes heroPulse {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 8px 22px rgba(239, 68, 68, 0.7); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--taiko-red), var(--taiko-red-dark));
            color: white;
            border: 2px solid #fca5a5;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.05em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .btn-primary:hover {
            transform: scale(1.03) translateY(-1px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: 2px solid #fef08a;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.05em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }
        .btn-warning:hover {
            background: linear-gradient(135deg, #d97706, #b45309);
            transform: scale(1.03) translateY(-1px);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #475569, #334155);
            color: white;
            border: 1px solid #64748b;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .soul-gauge-container {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .soul-label {
            font-size: 0.78em;
            font-weight: 900;
            color: var(--taiko-gold);
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 65px;
        }
        .soul-bar-bg {
            flex-grow: 1;
            height: 12px;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 1px solid #334155;
        }
        .soul-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--taiko-gold), var(--taiko-red), #ec4899);
            border-radius: 8px;
            transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
        }
        .soul-badge {
            font-size: 0.72em;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 10px;
            background: #334155;
            color: #94a3b8;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .soul-badge.active {
            background: linear-gradient(135deg, var(--taiko-gold), var(--taiko-red));
            color: #fff;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
            animation: pulseGlow 1s infinite alternate;
        }

        .dash-score-card .score-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            width: 100%;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .stat-label {
            font-size: 0.7em;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        .stat-value {
            font-size: 1.3em;
            font-weight: 900;
            color: var(--taiko-red);
            font-family: 'monospace', sans-serif;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
            transition: color 0.5s ease;
        }
        .stat-value.combo { color: var(--taiko-gold); }
        .stat-value.highscore { color: #38bdf8; }

        .taiko-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.8);
            padding: 8px 14px;
            border-radius: 16px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85em;
            color: #cbd5e1;
        }
        .tool-group label {
            font-weight: 700;
            color: var(--taiko-gold);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tool-select, .offset-btn, .btn-action-tool {
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .tool-select:hover, .offset-btn:hover, .btn-action-tool:hover {
            border-color: var(--taiko-gold);
            background: #1e293b;
        }
        .btn-action-danger {
            background: rgba(185, 28, 28, 0.3);
            border-color: #ef4444;
            color: #fca5a5;
        }
        .btn-action-danger:hover {
            background: #b91c1c;
            color: #fff;
        }
        .offset-btn { padding: 2px 7px; border-radius: 6px; }

        /* 體感目標與狀態 HUD 橫幅 */
        .motion-hud-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            border: 2px solid var(--taiko-gold);
            border-radius: 16px;
            padding: 8px 18px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .target-lyric-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .target-lyric-label {
            font-size: 0.9em;
            font-weight: 700;
            color: #94a3b8;
        }
        .target-lyric-char {
            font-size: 1.6em;
            font-weight: 900;
            color: #f59e0b;
            font-family: 'Yuji Mai', serif;
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 16px;
            border-radius: 12px;
            border: 1px solid rgba(245, 158, 11, 0.5);
            letter-spacing: 2px;
        }
        .camera-status-badge {
            font-size: 0.82em;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .camera-status-badge.active {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            color: #34d399;
        }

        /* 體感畫布容器 */
        .taiko-canvas-wrapper {
            position: relative;
            width: 100%;
            height: 420px;
            margin: 0 auto 12px auto;
            background: #060911;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid var(--taiko-red-dark);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0,0,0,0.9);
            transition: border-color 0.5s ease;
        }
        #taiko-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 擊打判定覆蓋文字 */
        .taiko-judgment-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 2.5em;
            font-weight: 900;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.12s ease-out, opacity 0.25s ease-out;
            z-index: 10;
            font-family: 'Yuji Mai', 'Noto Sans TC', serif;
            letter-spacing: 2px;
        }
        .taiko-judgment-overlay.perfect { color: #facc15; text-shadow: 0 0 25px #facc15, 0 0 12px #f59e0b; }
        .taiko-judgment-overlay.good { color: #38bdf8; text-shadow: 0 0 25px #38bdf8, 0 0 12px #0284c7; }
        .taiko-judgment-overlay.miss { color: #f43f5e; text-shadow: 0 0 15px #e11d48; }

        .motion-instruction-bar {
            text-align: center;
            font-size: 0.85em;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.7);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px dashed rgba(255,255,255,0.15);
            margin-top: 4px;
        }

        /* 結算 Modal */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-card {
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: white;
            border-radius: 28px;
            padding: 30px 35px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            border: 3px solid var(--taiko-gold);
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .rank-badge {
            font-size: 4.2em;
            font-weight: 900;
            margin: 8px 0;
            font-family: 'Yuji Mai', serif;
            background: linear-gradient(45deg, #facc15, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .result-details {
            margin: 15px 0 20px 0;
            background: rgba(30, 41, 59, 0.9);
            padding: 15px;
            border-radius: 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: left;
            font-size: 0.9em;
        }

        /* 吉祥物 */
        #mascot-container {
            position: fixed;
            bottom: 15px;
            left: 15px;
            z-index: 9999;
            cursor: grab;
            user-select: none;
            touch-action: none;
            transition: transform 0.2s ease-out;
        }
        #mascot-container img {
            width: 110px;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.5));
            transition: filter 0.3s ease;
        }
        #mascot-container:hover img {
            animation: rainbowNeon 1.5s infinite linear, mascotShake 0.4s infinite ease-in-out;
        }

        @keyframes rainbowNeon {
            0% { filter: drop-shadow(0 0 12px #ef4444) drop-shadow(0 0 22px #ef4444); }
            20% { filter: drop-shadow(0 0 12px #f59e0b) drop-shadow(0 0 22px #f59e0b); }
            40% { filter: drop-shadow(0 0 12px #10b981) drop-shadow(0 0 22px #10b981); }
            60% { filter: drop-shadow(0 0 12px #06b6d4) drop-shadow(0 0 22px #06b6d4); }
            80% { filter: drop-shadow(0 0 12px #ec4899) drop-shadow(0 0 22px #ec4899); }
            100% { filter: drop-shadow(0 0 12px #ef4444) drop-shadow(0 0 22px #ef4444); }
        }

        @keyframes mascotShake {
            0% { transform: rotate(0deg) scale(1.06); }
            25% { transform: rotate(-7deg) scale(1.09); }
            50% { transform: rotate(0deg) scale(1.06); }
            75% { transform: rotate(7deg) scale(1.09); }
            100% { transform: rotate(0deg) scale(1.06); }
        }

        #mascot-container.explode { animation: explode-animation 0.4s ease-in-out; }
        @keyframes explode-animation { 0% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
        .particle { position: absolute; width: 10px; height: 10px; border-radius: 50%; z-index: 200; pointer-events: none; }

        footer {
            position: fixed; bottom: 0; left: 0; right: 0; padding: 8px;
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(10px);
            color: rgba(255, 255, 255, 0.85); font-size: 0.8em; text-align: center; z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            body { padding: 8px; padding-bottom: 55px; }
            .container { padding: 14px 10px; border-radius: 18px; }
            header h1 { font-size: 1.4em; }
            .taiko-dashboard-grid { grid-template-columns: 1fr; gap: 8px; }
            .taiko-toolbar { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }
            .tool-group { justify-content: space-between; width: 100%; }
            #mascot-container img { width: 85px; }
            .taiko-canvas-wrapper { height: 350px; }
            .target-lyric-char { font-size: 1.25em; padding: 2px 10px; }
        }
    </style>
</head>
<body>
    <div class="background-icons" id="background-icons"></div>

    <!-- 隱藏攝影機影片元素 -->
    <video id="webcam-video" style="display:none;" playsinline muted></video>

    <div class="container">
        <header>
            <h1><i class="fas fa-hand-sparkles"></i> 雙溪高中校歌 - 體感接歌詞</h1>
            <p class="subtitle">SXHS Motion Phrase Lyric Catcher</p>
        </header>

        <!-- 雙欄 Dashboard -->
        <div class="taiko-dashboard-grid">
            <div class="dash-card dash-action-card">
                <div class="main-start-bar">
                    <button id="taiko-start-btn" class="btn-primary btn-hero"><i class="fas fa-play"></i> 開始體感接歌</button>
                    <button id="taiko-pause-btn" class="btn-warning btn-hero" style="display: none;"><i class="fas fa-pause"></i> 暫停遊戲</button>
                    <button id="taiko-restart-btn" class="btn-secondary btn-hero" style="display: none;"><i class="fas fa-rotate-right"></i> 重新開始</button>
                </div>
                <div class="soul-gauge-container">
                    <div class="soul-label"><i class="fas fa-fire"></i> 魂量條</div>
                    <div class="soul-bar-bg">
                        <div class="soul-bar-fill" id="soul-bar-fill"></div>
                    </div>
                    <div class="soul-badge" id="soul-badge"><i class="fas fa-fire-flame-curved"></i> 魂 SOUL</div>
                </div>
            </div>

    <script>
        // ====================================================
        // 全域變數與 DOM 初始化
        // ====================================================
        const audioPlayer = document.getElementById('audio-player');
        const mascotContainer = document.getElementById('mascot-container');
        const backgroundIconsContainer = document.getElementById('background-icons');
        const videoElement = document.getElementById('webcam-video');

        const themeSelect = document.getElementById('theme-select');
        const difficultySelect = document.getElementById('difficulty-select');
        const musicTrackSelect = document.getElementById('music-track-select');
        const btnToggleCamera = document.getElementById('btn-toggle-camera');
        const cameraStatusBadge = document.getElementById('camera-status-badge');
        const hudTargetChar = document.getElementById('hud-target-char');

        let sfxCtx = null;
        let taikoParticles = [];
        let taikoShockwaves = [];
        let taikoOffset = -0.15; // 與 對照用.html 完全相同的微調 Offset

        // MediaPipe & 體感座標
        let handsDetector = null;
        let cameraUtils = null;
        let isCameraActive = false;
        let handPositions = []; // 儲存追蹤到的手掌座標 [{x, y, active}]
        let mousePosition = { x: -100, y: -100, active: false }; // 滑鼠備援

        // ====================================================
        // 主題色彩管理
        // ====================================================
        function applyTheme(themeName) {
            document.body.setAttribute('data-theme', themeName);
            localStorage.setItem('sxhs_taiko_theme', themeName);
            if (themeSelect.value !== themeName) themeSelect.value = themeName;
            drawMotionCanvasBackground();
        }

        themeSelect.addEventListener('change', (e) => applyTheme(e.target.value));

        function initTheme() {
            const savedTheme = localStorage.getItem('sxhs_taiko_theme') || 'festival';
            applyTheme(savedTheme);
        }

        function getThemeColors() {
            const theme = document.body.getAttribute('data-theme') || 'festival';
            switch(theme) {
                case 'sakura':
                    return { target: '#f43f5e', targetBorder: '#fda4af', distractor: '#6b21a8', distractorBorder: '#c084fc', glow: '#f472b6', line: '#ec4899' };
                case 'cyberpunk':
                    return { target: '#ff0055', targetBorder: '#ff6699', distractor: '#075985', distractorBorder: '#38bdf8', glow: '#00f0ff', line: '#00f0ff' };
                case 'emerald':
                    return { target: '#10b981', targetBorder: '#6ee7b7', distractor: '#064e3b', distractorBorder: '#34d399', glow: '#34d399', line: '#10b981' };
                case 'gold':
                    return { target: '#eab308', targetBorder: '#fef08a', distractor: '#3f3f46', distractorBorder: '#a1a1aa', glow: '#fef08a', line: '#eab308' };
                default: // festival
                    return { target: '#ef4444', targetBorder: '#fca5a5', distractor: '#1e293b', distractorBorder: '#64748b', glow: '#f59e0b', line: '#ef4444' };
            }
        }

        function getSfxContext() {
            if (!sfxCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                sfxCtx = new AudioCtx();
            }
            if (sfxCtx.state === 'suspended') sfxCtx.resume();
            return sfxCtx;
        }

        function playSound(type) {
            try {
                const ctx = getSfxContext();
                const now = ctx.currentTime;

                if (type === 'hit') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'perfect') {
                    [523.25, 659.25, 783.99].forEach((freq, idx) => {
                        const o = ctx.createOscillator(); const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.type = 'sine'; o.frequency.value = freq;
                        g.gain.setValueAtTime(0.15, now + idx * 0.05);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.22);
                        o.start(now + idx * 0.05); o.stop(now + idx * 0.05 + 0.22);
                    });
                } else if (type === 'miss') {
                    const o = ctx.createOscillator(); const g = ctx.createGain();
                    o.connect(g); g.connect(ctx.destination);
                    o.type = 'sawtooth';
                    o.frequency.setValueAtTime(160, now);
                    o.frequency.linearRampToValueAtTime(50, now + 0.22);
                    g.gain.setValueAtTime(0.3, now);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                    o.start(now); o.stop(now + 0.22);
                }
            } catch (e) { console.error(e); }
        }

        // ====================================================
        // 精確參照《對照用.html》對拍數據 (lyricsData)
        // ====================================================
        const mp3RealBeatmap = [
            { startTime: 3.50, text: "雙溪高中" },
            { startTime: 7.20, text: "校歌預備" },
            { startTime: 10.80, text: "青山秀麗" },
            { startTime: 13.00, text: "碧波蕩漾" },
            { startTime: 14.90, text: "雙溪環抱" },
            { startTime: 17.00, text: "源遠流長" },
            { startTime: 19.10, text: "教我英才" },
            { startTime: 20.90, text: "育我棟樑" },
            { startTime: 23.10, text: "巍巍雙中" },
            { startTime: 24.90, text: "燦爛輝煌" },
            { startTime: 27.00, text: "勤學業" },
            { startTime: 28.10, text: "尊師長" },
            { startTime: 29.00, text: "鍛體魄" },
            { startTime: 30.00, text: "敬同窗" },
            { startTime: 31.00, text: "立志光大" },
            { startTime: 33.00, text: "寰宇門墻" },
            { startTime: 35.00, text: "青山秀麗" },
            { startTime: 37.00, text: "碧波蕩漾" },
            { startTime: 39.00, text: "雙溪環抱" },
            { startTime: 41.00, text: "源遠流長" },
            { startTime: 42.80, text: "教我英才" },
            { startTime: 45.00, text: "育我棟樑" },
            { startTime: 47.00, text: "巍巍雙中" },
            { startTime: 49.00, text: "燦爛輝煌" }
        ];

        const distractorWords = [
            "高山流水", "春風化雨", "桃李芬芳", "自強不息",
            "溫故知新", "博學多聞", "光輝歲月", "鵬程萬里",
            "學無止境", "精益求精", "風和日麗", "朝氣蓬勃"
        ];

        const LEAD_TIME = 2.2; 

        // ====================================================
        // 體感遊戲主控與 Canvas 繪製
        // ====================================================
        const taikoCanvas = document.getElementById('taiko-canvas');
        let tCtx = null;
        let fallingBubbles = [];
        let currentNotePointer = 0;

        let taikoScore = 0, taikoCombo = 0, taikoMaxCombo = 0;
        let taikoPerfect = 0, taikoGood = 0, taikoMiss = 0;
        let soulValue = 0;

        let isTaikoRunning = false;
        let isTaikoPaused = false;
        let taikoAnimFrame = null;

        function initTaikoCanvas() {
            if (!taikoCanvas) return;
            tCtx = taikoCanvas.getContext('2d');
            const rect = taikoCanvas.parentElement.getBoundingClientRect();
            taikoCanvas.width = rect.width; taikoCanvas.height = rect.height;
            drawMotionCanvasBackground();
            const savedHighScore = localStorage.getItem('sxhs_taiko_highscore') || 0;
            document.getElementById('taiko-highscore').textContent = savedHighScore;
        }

        function drawMotionCanvasBackground() {
            if (!tCtx) return;
            const W = taikoCanvas.width; const H = taikoCanvas.height;
            tCtx.clearRect(0, 0, W, H);

            // 若相機開啟，繪製鏡像相機影像
            if (isCameraActive && videoElement.readyState >= 2) {
                tCtx.save();
                tCtx.translate(W, 0);
                tCtx.scale(-1, 1);
                tCtx.globalAlpha = 0.45;
                tCtx.drawImage(videoElement, 0, 0, W, H);
                tCtx.restore();
            }

            // 繪製黃金對拍打擊線 (Target Y = 72% H)
            const targetY = H * 0.72;
            const themeColors = getThemeColors();
            tCtx.save();
            tCtx.strokeStyle = themeColors.targetBorder || '#f59e0b';
            tCtx.lineWidth = 3;
            tCtx.shadowBlur = 10;
            tCtx.shadowColor = themeColors.glow;
            tCtx.setLineDash([12, 8]);
            tCtx.beginPath(); tCtx.moveTo(0, targetY); tCtx.lineTo(W, targetY); tCtx.stroke();

            // 區域標示
            tCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            tCtx.font = '900 14px "Noto Sans TC", sans-serif';
            tCtx.fillText("🎯 歌曲歌詞唱出對拍線 (TARGET LINE)", 18, targetY - 10);
            tCtx.restore();
        }

        function stopAllGames() {
            audioPlayer.pause();
            if (taikoAnimFrame) cancelAnimationFrame(taikoAnimFrame);
            isTaikoRunning = false;
            isTaikoPaused = false;
            document.getElementById('taiko-start-btn').style.display = 'inline-flex';
            document.getElementById('taiko-pause-btn').style.display = 'none';
            document.getElementById('taiko-restart-btn').style.display = 'none';
        }

        function startTaikoGame() {
            getSfxContext(); stopAllGames();
            fallingBubbles = [];
            currentNotePointer = 0;
            taikoScore = 0; taikoCombo = 0; taikoMaxCombo = 0;
            taikoPerfect = 0; taikoGood = 0; taikoMiss = 0; soulValue = 0;
            taikoParticles = []; taikoShockwaves = [];
            updateTaikoStatsUI(); updateSoulGaugeUI();

            audioPlayer.src = musicTrackSelect.value;
            audioPlayer.currentTime = 0;
            audioPlayer.play();
            isTaikoRunning = true;
            isTaikoPaused = false;

            document.getElementById('taiko-start-btn').style.display = 'none';
            document.getElementById('taiko-pause-btn').style.display = 'inline-flex';
            document.getElementById('taiko-pause-btn').innerHTML = '<i class="fas fa-pause"></i> 暫停遊戲';
            document.getElementById('taiko-pause-btn').className = 'btn-warning btn-hero';
            document.getElementById('taiko-restart-btn').style.display = 'inline-flex';

            updateHUDTarget();

            if (taikoAnimFrame) cancelAnimationFrame(taikoAnimFrame);
            motionGameLoop();
        }

        function togglePauseTaikoGame() {
            if (!isTaikoRunning) return;
            const pauseBtn = document.getElementById('taiko-pause-btn');

            if (!isTaikoPaused) {
                isTaikoPaused = true;
                audioPlayer.pause();
                pauseBtn.innerHTML = '<i class="fas fa-play"></i> 繼續遊戲';
                pauseBtn.className = 'btn-primary btn-hero';
                drawPauseOverlay();
            } else {
                isTaikoPaused = false;
                audioPlayer.play();
                pauseBtn.innerHTML = '<i class="fas fa-pause"></i> 暫停遊戲';
                pauseBtn.className = 'btn-warning btn-hero';
                if (taikoAnimFrame) cancelAnimationFrame(taikoAnimFrame);
                motionGameLoop();
            }
        }

        function drawPauseOverlay() {
            if (!tCtx) return;
            const W = taikoCanvas.width; const H = taikoCanvas.height;
            tCtx.save();
            tCtx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            tCtx.fillRect(0, 0, W, H);
            tCtx.fillStyle = '#f59e0b';
            tCtx.font = '900 24px "Yuji Mai", serif';
            tCtx.textAlign = 'center'; tCtx.textBaseline = 'middle';
            tCtx.fillText("⏸️ 詞組接歌暫停中", W / 2, H / 2);
            tCtx.restore();
        }

        // 精確反映場上正在對拍的目標歌詞
        function updateHUDTarget() {
            const activeTarget = fallingBubbles.find(b => b.isTarget && !b.hit && !b.missed);
            if (activeTarget) {
                hudTargetChar.textContent = activeTarget.text;
            } else if (currentNotePointer < mp3RealBeatmap.length) {
                hudTargetChar.textContent = mp3RealBeatmap[currentNotePointer].text;
            } else {
                hudTargetChar.textContent = "🎉 全曲完奏";
            }
        }

        // 泡泡產生器 (支援困難模式多干擾詞與同色化)
        function spawnLyricsBubbles(adjustedTime) {
            const W = taikoCanvas.width;
            const isHard = difficultySelect.value === 'hard';

            while (currentNotePointer < mp3RealBeatmap.length) {
                const note = mp3RealBeatmap[currentNotePointer];
                if (adjustedTime >= note.startTime - LEAD_TIME) {
                    const textLen = note.text.length;
                    const bubbleWidth = textLen <= 3 ? 120 : 155;
                    const bubbleHeight = 52;
                    const targetX = Math.random() * (W - bubbleWidth - 40) + (bubbleWidth / 2 + 20);

                    // 正確詞組泡泡
                    fallingBubbles.push({
                        id: 'target_' + currentNotePointer,
                        x: targetX,
                        width: bubbleWidth,
                        height: bubbleHeight,
                        text: note.text,
                        targetTime: note.startTime,
                        isTarget: true,
                        noteIndex: currentNotePointer,
                        hit: false,
                        missed: false
                    });

                    // 產生干擾詞組泡泡 (困難模式產生 2 個，增加迷霧難度)
                    const distractorCount = isHard ? 2 : 1;
                    for (let d = 0; d < distractorCount; d++) {
                        const distractorText = distractorWords[Math.floor(Math.random() * distractorWords.length)];
                        let distractorX = Math.random() * (W - bubbleWidth - 40) + (bubbleWidth / 2 + 20);
                        if (Math.abs(distractorX - targetX) < bubbleWidth + 20) {
                            distractorX = (targetX + (d + 1) * 160) % (W - bubbleWidth - 30) + (bubbleWidth / 2 + 15);
                        }

                        fallingBubbles.push({
                            id: `distractor_${currentNotePointer}_${d}`,
                            x: distractorX,
                            width: bubbleWidth,
                            height: bubbleHeight,
                            text: distractorText,
                            targetTime: note.startTime + (d * 0.08),
                            isTarget: false,
                            noteIndex: currentNotePointer,
                            hit: false,
                            missed: false
                        });
                    }

                    currentNotePointer++;
                } else {
                    break;
                }
            }
        }

        function checkCapsuleCollision(b, bY, pt) {
            const halfW = b.width / 2;
            const halfH = b.height / 2;
            const closestX = Math.max(b.x - halfW, Math.min(pt.x, b.x + halfW));
            const closestY = Math.max(bY - halfH, Math.min(pt.y, bY + halfH));
            const distance = Math.hypot(pt.x - closestX, pt.y - closestY);
            return distance < 28;
        }

        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x - width / 2 + radius, y - height / 2);
            ctx.lineTo(x + width / 2 - radius, y - height / 2);
            ctx.arcTo(x + width / 2, y - height / 2, x + width / 2, y - height / 2 + radius, radius);
            ctx.lineTo(x + width / 2, y + height / 2 - radius);
            ctx.arcTo(x + width / 2, y + height / 2, x + width / 2 - radius, y + height / 2, radius);
            ctx.lineTo(x - width / 2 + radius, y + height / 2);
            ctx.arcTo(x - width / 2, y + height / 2, x - width / 2, y + height / 2 - radius, radius);
            ctx.lineTo(x - width / 2, y - height / 2 + radius);
            ctx.arcTo(x - width / 2, y - height / 2, x - width / 2 + radius, y - height / 2, radius);
            ctx.closePath();
        }

        // 主體感遊戲循環
        function motionGameLoop() {
            if (!isTaikoRunning || isTaikoPaused) return;

            const W = taikoCanvas.width; const H = taikoCanvas.height;
            const startY = -35;
            const targetY = H * 0.72;
            const adjustedTime = audioPlayer.currentTime - taikoOffset;
            const themeColors = getThemeColors();
            const isHard = difficultySelect.value === 'hard';

            // 1. 生成新歌詞泡泡
            spawnLyricsBubbles(adjustedTime);

            // 2. 更新頂部 HUD 目標提示
            updateHUDTarget();

            // 3. 繪製背景
            drawMotionCanvasBackground();

            // 4. 取得所有活躍觸碰點
            let activeTouchPoints = [];
            if (handPositions.length > 0) {
                activeTouchPoints = handPositions;
            } else if (mousePosition.active) {
                activeTouchPoints = [mousePosition];
            }

            // 5. 繪製與碰撞檢測
            for (let i = fallingBubbles.length - 1; i >= 0; i--) {
                const b = fallingBubbles[i];
                if (b.hit) continue;

                const progress = (adjustedTime - (b.targetTime - LEAD_TIME)) / LEAD_TIME;
                const bY = startY + progress * (targetY - startY);

                // 碰撞檢測
                let touched = false;
                for (let pt of activeTouchPoints) {
                    if (checkCapsuleCollision(b, bY, pt)) {
                        touched = true;
                        break;
                    }
                }

                if (touched) {
                    b.hit = true;
                    if (b.isTarget) {
                        // 成功接到正確詞組！困難模式享有 1.5 倍高分！
                        taikoPerfect++;
                        const baseAdd = isHard ? 2200 : 1500;
                        taikoScore += baseAdd + taikoCombo * 40;
                        taikoCombo++;
                        soulValue = Math.min(100, soulValue + (isHard ? 5.5 : 4.0));
                        showTaikoJudgment(`良 ${b.text}`, 'perfect');
                        createHitParticles(b.x, bY, '#facc15');
                        createShockwave(b.x, bY, themeColors.target);
                        playSound('perfect');
                    } else {
                        // 接到干擾詞！
                        taikoMiss++;
                        taikoCombo = 0;
                        soulValue = Math.max(0, soulValue - 7);
                        showTaikoJudgment(`錯 ${b.text}`, 'miss');
                        createHitParticles(b.x, bY, '#f43f5e');
                        playSound('miss');
                    }
                    if (taikoCombo > taikoMaxCombo) taikoMaxCombo = taikoCombo;
                    updateTaikoStatsUI(); updateSoulGaugeUI();
                    continue;
                }

                // 漏接處置
                if (bY > H + 45) {
                    if (b.isTarget && !b.missed) {
                        b.missed = true;
                        taikoMiss++; taikoCombo = 0;
                        soulValue = Math.max(0, soulValue - 5);
                        showTaikoJudgment(`漏 ${b.text}`, 'miss');
                        playSound('miss');
                        updateTaikoStatsUI(); updateSoulGaugeUI();
                    }
                    fallingBubbles.splice(i, 1);
                    continue;
                }

                // 繪製膠囊詞組泡泡
                tCtx.save();
                // 困難模式下：所有泡泡外觀與顏色完全相同，沒有顏色視覺提示！
                const bubbleColor = (b.isTarget || isHard) ? themeColors.target : themeColors.distractor;
                const borderColor = (b.isTarget || isHard) ? themeColors.targetBorder : themeColors.distractorBorder;

                // 發光邊框
                tCtx.shadowBlur = (b.isTarget || isHard) ? 16 : 6;
                tCtx.shadowColor = bubbleColor;

                // 圓角矩形本體
                drawRoundedRect(tCtx, b.x, bY, b.width, b.height, b.height / 2);
                tCtx.fillStyle = bubbleColor;
                tCtx.fill();
                tCtx.strokeStyle = borderColor;
                tCtx.lineWidth = 3.5;
                tCtx.stroke();

                // 內部詞組文字
                tCtx.shadowBlur = 0;
                tCtx.font = `900 20px "Noto Sans TC", sans-serif`;
                tCtx.textAlign = 'center'; tCtx.textBaseline = 'middle';
                tCtx.strokeStyle = 'rgba(0, 0, 0, 0.85)'; tCtx.lineWidth = 4;
                tCtx.strokeText(b.text, b.x, bY + 1);
                tCtx.fillStyle = '#ffffff';
                tCtx.fillText(b.text, b.x, bY + 1);

                tCtx.restore();
            }

            // 6. 繪製手掌游標
            drawHandCursor(activeTouchPoints);

            // 7. 更新擊打粒子與衝擊波
            updateAndDrawParticles();
            updateAndDrawShockwaves();

            // 8. 檢查遊戲結束
            if (audioPlayer.ended || (currentNotePointer >= mp3RealBeatmap.length && fallingBubbles.length === 0)) {
                endTaikoGame(); return;
            }

            taikoAnimFrame = requestAnimationFrame(motionGameLoop);
        }

        function drawHandCursor(points) {
            if (!tCtx || points.length === 0) return;
            const themeColors = getThemeColors();

            points.forEach(pt => {
                tCtx.save();
                tCtx.shadowBlur = 20;
                tCtx.shadowColor = themeColors.glow;
                tCtx.fillStyle = themeColors.glow;
                tCtx.beginPath(); tCtx.arc(pt.x, pt.y, 23, 0, Math.PI * 2); tCtx.fill();
                tCtx.strokeStyle = '#ffffff'; tCtx.lineWidth = 3.5; tCtx.stroke();

                tCtx.fillStyle = '#ffffff';
                tCtx.beginPath(); tCtx.arc(pt.x, pt.y, 7, 0, Math.PI * 2); tCtx.fill();
                tCtx.restore();
            });
        }

        function createHitParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                taikoParticles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 7 + 3,
                    color: color,
                    life: 1.0
                });
            }
        }

        function createShockwave(x, y, color) {
            taikoShockwaves.push({ x: x, y: y, radius: 28, maxRadius: 80, color: color, opacity: 1.0 });
        }

        function updateAndDrawParticles() {
            for (let i = taikoParticles.length - 1; i >= 0; i--) {
                const p = taikoParticles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.04;
                if (p.life <= 0) { taikoParticles.splice(i, 1); continue; }
                tCtx.save();
                tCtx.globalAlpha = p.life;
                tCtx.fillStyle = p.color;
                tCtx.beginPath(); tCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); tCtx.fill();
                tCtx.restore();
            }
        }

        function updateAndDrawShockwaves() {
            for (let i = taikoShockwaves.length - 1; i >= 0; i--) {
                const sw = taikoShockwaves[i];
                sw.radius += 4; sw.opacity -= 0.05;
                if (sw.opacity <= 0) { taikoShockwaves.splice(i, 1); continue; }
                tCtx.save();
                tCtx.globalAlpha = sw.opacity;
                tCtx.strokeStyle = sw.color; tCtx.lineWidth = 4;
                tCtx.beginPath(); tCtx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2); tCtx.stroke();
                tCtx.restore();
            }
        }

        function showTaikoJudgment(text, typeClass) {
            const overlay = document.getElementById('taiko-judgment-overlay');
            overlay.textContent = text; overlay.className = `taiko-judgment-overlay ${typeClass}`;
            overlay.style.opacity = '1'; overlay.style.transform = 'translate(-50%, -60%) scale(1.15)';
            setTimeout(() => { overlay.style.opacity = '0'; overlay.style.transform = 'translate(-50%, -50%) scale(0.9)'; }, 280);
        }

        function updateTaikoStatsUI() {
            document.getElementById('taiko-score').textContent = taikoScore;
            document.getElementById('taiko-combo').textContent = taikoCombo;
            const total = taikoPerfect + taikoGood + taikoMiss;
            const acc = total === 0 ? 100 : Math.round(((taikoPerfect + taikoGood * 0.6) / total) * 100);
            document.getElementById('taiko-acc').textContent = `${acc}%`;
        }

        function updateSoulGaugeUI() {
            const fillElem = document.getElementById('soul-bar-fill');
            const badgeElem = document.getElementById('soul-badge');
            fillElem.style.width = `${soulValue}%`;

            if (soulValue >= 80) {
                badgeElem.classList.add('active');
                badgeElem.innerHTML = '<i class="fas fa-fire-flame-curved"></i> 魂 (SOUL ON)';
            } else {
                badgeElem.classList.remove('active');
                badgeElem.innerHTML = '<i class="fas fa-fire-flame-curved"></i> 魂 SOUL';
            }
        }

        function endTaikoGame() {
            stopAllGames();
            const oldHighScore = parseInt(localStorage.getItem('sxhs_taiko_highscore') || '0', 10);
            if (taikoScore > oldHighScore) {
                localStorage.setItem('sxhs_taiko_highscore', taikoScore);
                document.getElementById('taiko-highscore').textContent = taikoScore;
            }

            let rank = 'C';
            if (taikoScore >= 32000) rank = 'SS';
            else if (taikoScore >= 24000) rank = 'S';
            else if (taikoScore >= 16000) rank = 'A';
            else if (taikoScore >= 8000) rank = 'B';

            document.getElementById('modal-rank').textContent = rank;
            document.getElementById('modal-result-details').innerHTML = `
                <p>最終得分：<span>${taikoScore}</span></p>
                <p>最高連擊：<span>${taikoMaxCombo}</span></p>
                <p>魂量達成：<span>${Math.round(soulValue)}%</span></p>
                <p>良 (PERFECT)：<span>${taikoPerfect}</span></p>
                <p>不可 (MISS)：<span>${taikoMiss}</span></p>
            `;
            document.getElementById('game-over-modal').style.display = 'flex';
        }

        // 微調對拍控制器
        document.getElementById('offset-minus').addEventListener('click', () => {
            taikoOffset = parseFloat((taikoOffset - 0.05).toFixed(2));
            document.getElementById('offset-val').textContent = `${taikoOffset > 0 ? '+' : ''}${taikoOffset}s`;
        });
        document.getElementById('offset-plus').addEventListener('click', () => {
            taikoOffset = parseFloat((taikoOffset + 0.05).toFixed(2));
            document.getElementById('offset-val').textContent = `${taikoOffset > 0 ? '+' : ''}${taikoOffset}s`;
        });

        // ====================================================
        // MediaPipe Hands 辨識與相機整合
        // ====================================================
        function initMediaPipeHands() {
            if (typeof Hands === 'undefined') return;

            handsDetector = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            handsDetector.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.55,
                minTrackingConfidence: 0.55
            });

            handsDetector.onResults((results) => {
                handPositions = [];
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const W = taikoCanvas.width; const H = taikoCanvas.height;
                    for (let landmarks of results.multiHandLandmarks) {
                        const indexTip = landmarks[8];
                        const hx = (1 - indexTip.x) * W;
                        const hy = indexTip.y * H;
                        handPositions.push({ x: hx, y: hy, active: true });
                    }
                }
            });
        }

        async function toggleCamera() {
            if (!isCameraActive) {
                try {
                    if (!handsDetector) initMediaPipeHands();

                    cameraUtils = new Camera(videoElement, {
                        onFrame: async () => {
                            if (handsDetector) await handsDetector.send({ image: videoElement });
                        },
                        width: 640,
                        height: 480
                    });

                    await cameraUtils.start();
                    isCameraActive = true;
                    cameraStatusBadge.className = "camera-status-badge active";
                    cameraStatusBadge.innerHTML = '<i class="fas fa-video"></i> 鏡頭辨識中 (手掌追蹤)';
                    btnToggleCamera.innerHTML = '<i class="fas fa-video-slash"></i> 關閉鏡頭';
                } catch (err) {
                    console.error("相機開啓失敗:", err);
                    alert("無法啟動相機。請確認已授予相機使用權限。系統將維持滑鼠/觸控模式。");
                }
            } else {
                if (cameraUtils) cameraUtils.stop();
                isCameraActive = false;
                handPositions = [];
                cameraStatusBadge.className = "camera-status-badge";
                cameraStatusBadge.innerHTML = '<i class="fas fa-video-slash"></i> 備援模式 (滑鼠/觸控)';
                btnToggleCamera.innerHTML = '<i class="fas fa-video"></i> 開啟鏡頭';
            }
        }

        btnToggleCamera.addEventListener('click', toggleCamera);

        // 滑鼠與觸控備援
        taikoCanvas.addEventListener('mousemove', (e) => {
            const rect = taikoCanvas.getBoundingClientRect();
            mousePosition.x = e.clientX - rect.left;
            mousePosition.y = e.clientY - rect.top;
            mousePosition.active = true;
        });

        taikoCanvas.addEventListener('mouseleave', () => {
            mousePosition.active = false;
        });

        taikoCanvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const rect = taikoCanvas.getBoundingClientRect();
                mousePosition.x = e.touches[0].clientX - rect.left;
                mousePosition.y = e.touches[0].clientY - rect.top;
                mousePosition.active = true;
            }
        }, { passive: true });

        // ====================================================
        // 按鈕與清除事件
        // ====================================================
        document.getElementById('btn-clear-score').addEventListener('click', () => {
            if (confirm('確定要一鍵清除最高分紀錄與當前分數嗎？')) {
                localStorage.removeItem('sxhs_taiko_highscore');
                taikoScore = 0; taikoCombo = 0; taikoMaxCombo = 0;
                taikoPerfect = 0; taikoGood = 0; taikoMiss = 0; soulValue = 0;
                document.getElementById('taiko-highscore').textContent = '0';
                updateTaikoStatsUI(); updateSoulGaugeUI();
                playSound('miss');
            }
        });

        document.getElementById('taiko-start-btn').addEventListener('click', async () => {
            if (!isCameraActive && typeof Hands !== 'undefined') {
                await toggleCamera();
            }
            startTaikoGame();
        });

        document.getElementById('taiko-pause-btn').addEventListener('click', togglePauseTaikoGame);
        document.getElementById('taiko-restart-btn').addEventListener('click', startTaikoGame);
        document.getElementById('modal-close-btn').addEventListener('click', () => {
            document.getElementById('game-over-modal').style.display = 'none';
        });

        // ====================================================
        // 背景浮動圖示
        // ====================================================
        function createFloatingIcons() {
            const icons = ['fa-hand-sparkles', 'fa-music', 'fa-fire', 'fa-star', 'fa-heart', 'fa-bolt', 'fa-palette'];
            backgroundIconsContainer.innerHTML = '';
            for (let i = 0; i < 22; i++) {
                const icon = document.createElement('i');
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                icon.className = `fas ${randomIcon}`;
                icon.style.left = `${Math.random() * 100}vw`;
                icon.style.fontSize = `${Math.random() * 45 + 18}px`;
                icon.style.animationDuration = `${Math.random() * 14 + 8}s`;
                icon.style.animationDelay = `${Math.random() * 8}s`;
                backgroundIconsContainer.appendChild(icon);
            }
        }

        // ====================================================
        // 可拖曳吉祥物 (LiyuChillGuy)
        // ====================================================
        let isDraggingMascot = false;
        let hasMovedMascot = false;
        let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;
        let mascotClickCounter = 0;

        function onMascotDragStart(e) {
            isDraggingMascot = true;
            hasMovedMascot = false;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX; startY = clientY;

            const rect = mascotContainer.getBoundingClientRect();
            initialLeft = rect.left; initialTop = rect.top;

            mascotContainer.style.bottom = 'auto';
            mascotContainer.style.right = 'auto';
            mascotContainer.style.left = `${initialLeft}px`;
            mascotContainer.style.top = `${initialTop}px`;
            mascotContainer.style.cursor = 'grabbing';
        }

        function onMascotDragMove(e) {
            if (!isDraggingMascot) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - startX; const dy = clientY - startY;

            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMovedMascot = true;

            mascotContainer.style.left = `${initialLeft + dx}px`;
            mascotContainer.style.top = `${initialTop + dy}px`;
        }

        function onMascotDragEnd() {
            if (!isDraggingMascot) return;
            isDraggingMascot = false;
            mascotContainer.style.cursor = 'grab';
        }

        mascotContainer.addEventListener('mousedown', onMascotDragStart);
        document.addEventListener('mousemove', onMascotDragMove);
        document.addEventListener('mouseup', onMascotDragEnd);

        mascotContainer.addEventListener('touchstart', onMascotDragStart, { passive: false });
        document.addEventListener('touchmove', onMascotDragMove, { passive: false });
        document.addEventListener('touchend', onMascotDragEnd);

        mascotContainer.addEventListener('click', () => {
            if (hasMovedMascot) return;
            mascotClickCounter++;
            const rect = mascotContainer.getBoundingClientRect();
            createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
            playSound('hit');

            if (mascotClickCounter >= 8) {
                mascotContainer.classList.add('explode');
                setTimeout(() => {
                    mascotContainer.classList.remove('explode');
                    mascotContainer.style.transform = 'scale(1)';
                    mascotClickCounter = 0;
                }, 400);
            } else {
                mascotContainer.style.transform = `scale(${1 + mascotClickCounter * 0.1})`;
            }
        });

        function createParticles(x, y) {
            const particleColors = ['#ef4444', '#f59e0b', '#38bdf8', '#10b981', '#ec4899'];
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                document.body.appendChild(particle);
                const size = Math.random() * 10 + 6;
                const angle = Math.random() * 360;
                const velocity = Math.random() * 6 + 3;
                const dx = Math.cos(angle * Math.PI / 180) * velocity;
                let dy = Math.sin(angle * Math.PI / 180) * velocity;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.background = particleColors[Math.floor(Math.random() * particleColors.length)];
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                const animate = () => {
                    dy += 0.1;
                    particle.style.left = `${parseFloat(particle.style.left) + dx}px`;
                    particle.style.top = `${parseFloat(particle.style.top) + dy}px`;
                    particle.style.opacity = parseFloat(particle.style.opacity || 1) - 0.025;
                    if (parseFloat(particle.style.opacity) > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        particle.remove();
                    }
                };
                requestAnimationFrame(animate);
            }
        }

        window.addEventListener('resize', () => {
            initTaikoCanvas();
        });

        // 初始化
        initTheme();
        createFloatingIcons();
        initTaikoCanvas();
        initMediaPipeHands();
    </script>
</body>
</html>
